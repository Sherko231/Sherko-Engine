name: Bootstrap Java formatting

on:
  push:
    branches:
      - pre-p6-java-formatting-style

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-p6-java-formatting-style

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply repository Java formatter
        run: .\gradlew.bat spotlessApply

      - name: Commit formatter output
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.java'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "No formatter changes to commit."
            exit 0
          }
          git commit -m "[PRE-P6] Apply repository Java formatter"
          git push origin HEAD:pre-p6-java-formatting-style
