name: Bootstrap Java formatting

on:
  push:
    branches:
      - pre-p6-java-formatting-style

permissions:
  contents: read

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-p6-java-formatting-style
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify formatter is idempotent
        shell: powershell
        run: |
          & .\gradlew.bat spotlessApply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- '*.java'
          if ($LASTEXITCODE -ne 0) {
            throw "spotlessApply changed already-formatted Java sources"
          }

      - name: Verify committed formatting
        run: .\gradlew.bat spotlessCheck

      - name: Verify Java lexical content is unchanged
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys

          def semantic_signature(source: str) -> str:
              out = []
              i = 0
              n = len(source)
              while i < n:
                  c = source[i]
                  if c.isspace():
                      i += 1
                      continue
                  if source.startswith("//", i):
                      i += 2
                      while i < n and source[i] not in "\r\n":
                          i += 1
                      continue
                  if source.startswith("/*", i):
                      end = source.find("*/", i + 2)
                      i = n if end < 0 else end + 2
                      continue
                  if source.startswith('"""', i):
                      start = i
                      end = source.find('"""', i + 3)
                      if end < 0:
                          raise RuntimeError("unterminated text block")
                      i = end + 3
                      out.append("TEXT:" + source[start:i])
                      continue
                  if c in {'"', "'"}:
                      quote = c
                      start = i
                      i += 1
                      while i < n:
                          if source[i] == "\\":
                              i += 2
                              continue
                          if source[i] == quote:
                              i += 1
                              break
                          i += 1
                      out.append("LIT:" + source[start:i])
                      continue
                  if c.isalpha() or c in "_$":
                      start = i
                      i += 1
                      while i < n and (source[i].isalnum() or source[i] in "_$"):
                          i += 1
                      out.append("ID:" + source[start:i])
                      continue
                  if c.isdigit():
                      start = i
                      i += 1
                      while i < n and (source[i].isalnum() or source[i] in "_.$"):
                          i += 1
                      out.append("NUM:" + source[start:i])
                      continue
                  out.append("P:" + c)
                  i += 1
              return "\0".join(out)

          paths = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/master...HEAD", "--", "*.java"],
              text=True,
          ).splitlines()

          mismatches = []
          for name in paths:
              old = subprocess.check_output(
                  ["git", "show", f"origin/master:{name}"],
                  text=True,
                  encoding="utf-8",
              )
              new = pathlib.Path(name).read_text(encoding="utf-8")
              if semantic_signature(old) != semantic_signature(new):
                  mismatches.append(name)

          print(f"Checked {len(paths)} changed Java files for lexical equivalence.")
          if mismatches:
              print("Non-formatting Java changes detected:")
              for name in mismatches:
                  print(name)
              sys.exit(1)
