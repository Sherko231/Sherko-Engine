name: Bootstrap Java formatting

on:
  push:
    branches:
      - pre-p6-java-formatting-style

permissions:
  contents: read

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-p6-java-formatting-style

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify formatter is idempotent
        shell: powershell
        run: |
          & .\gradlew.bat spotlessApply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- '*.java'
          if ($LASTEXITCODE -ne 0) {
            throw "spotlessApply changed already-formatted Java sources"
          }

      - name: Verify committed formatting
        run: .\gradlew.bat spotlessCheck
