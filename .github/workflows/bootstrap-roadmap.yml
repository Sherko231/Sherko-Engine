name: Bootstrap roadmap
on:
  push:
    branches: [master]
    paths: ['.github/workflows/bootstrap-roadmap.yml']
permissions:
  contents: read
  issues: write
  repository-projects: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const O=context.repo.owner,R=context.repo.repo,T='Sherko Engine Development';
            const labs={
              'type:spike':'BFD4F2','type:feature':'1D76DB','type:bug':'D73A4A','type:docs':'0075CA','type:refactor':'5319E7','type:test':'0E8A16',
              'area:build-ci':'C5DEF5','area:core':'C5DEF5','area:platform':'C5DEF5','area:input':'C5DEF5','area:math':'C5DEF5','area:rendering':'C5DEF5','area:assets':'C5DEF5','area:world':'C5DEF5','area:physics':'C5DEF5','area:gameplay':'C5DEF5','area:networking':'C5DEF5','area:steam':'C5DEF5','area:audio':'C5DEF5','area:animation':'C5DEF5','area:ai-nav':'C5DEF5','area:editor':'C5DEF5','area:release':'C5DEF5','area:documentation':'C5DEF5','decision-needed':'FBCA04'};
            for(const [name,color] of Object.entries(labs)){try{await github.rest.issues.getLabel({owner:O,repo:R,name});await github.rest.issues.updateLabel({owner:O,repo:R,name,color})}catch(e){if(e.status===404)await github.rest.issues.createLabel({owner:O,repo:R,name,color});else throw e}}
            const ms=[['M0 — Feasibility','P0'],['M1 — Engine Foundation','P1-P4'],['M2 — Local Playable Runtime','P5-P9'],['M3 — Multiplayer Core','P10-P13'],['M4 — Genre Systems','P14'],['M5 — Tools','P15'],['M6 — Production Base','P16']];
            const old=await github.paginate(github.rest.issues.listMilestones,{owner:O,repo:R,state:'all',per_page:100}),mn={};
            for(const [title,description] of ms){let m=old.find(x=>x.title===title);m=m?(await github.rest.issues.updateMilestone({owner:O,repo:R,milestone_number:m.number,title,description,state:'open'})).data:(await github.rest.issues.createMilestone({owner:O,repo:R,title,description})).data;mn[title]=m.number}
            const im={18:['type:docs,area:documentation','Documentation','P2 Normal','XS','P0-T01','Done'],19:['type:feature,area:build-ci','Build / CI','P1 High','S','P0-T02','Ready'],20:['type:spike,area:rendering','Rendering','P1 High','S','P0-T03','Backlog'],21:['type:spike,area:physics','Physics','P1 High','S','P0-T04','Backlog'],22:['type:spike,area:audio','Audio','P1 High','S','P0-T05','Backlog'],23:['type:spike,area:networking','Networking','P1 High','S','P0-T06','Backlog'],24:['type:spike,area:steam','Steam','P1 High','S','P0-T07','Backlog'],25:['type:spike,area:steam,decision-needed','Steam','P0 Critical','M','P0-T08','Backlog'],26:['type:spike,area:steam,decision-needed','Steam','P0 Critical','M','P0-T09','Backlog'],27:['type:docs,area:networking,decision-needed','Networking','P0 Critical','S','P0-T10','Backlog'],28:['type:test,area:networking','Networking','P1 High','M','P0-T11','Backlog'],29:['type:test,area:core','Core','P0 Critical','M','P0-T12','Backlog']};
            for(const [n,a] of Object.entries(im)){const q=await github.rest.issues.get({owner:O,repo:R,issue_number:+n});const body=(q.data.body||'').replace(/^Parent epic: #1\nMilestone target: M0 — Feasibility\n\n/m,'Phase: P0 — Feasibility\nMilestone: M0 — Feasibility\n\n');await github.rest.issues.update({owner:O,repo:R,issue_number:+n,body,milestone:mn['M0 — Feasibility'],labels:a[0].split(',')})}
            try{
              const b=await github.graphql(`query($o:String!,$r:String!){user(login:$o){id projectsV2(first:100){nodes{id number title}}} repository(owner:$o,name:$r){id}}`,{o:O,r:R});
              let p=b.user.projectsV2.nodes.find(x=>x.title===T);if(!p)p=(await github.graphql(`mutation($u:ID!,$r:ID!,$t:String!){createProjectV2(input:{ownerId:$u,repositoryId:$r,title:$t}){projectV2{id number title}}}`,{u:b.user.id,r:b.repository.id,t:T})).createProjectV2.projectV2;
              const G=()=>github.graphql(`query($id:ID!){node(id:$id){... on ProjectV2{id number fields(first:100){nodes{... on ProjectV2Field{id name dataType} ... on ProjectV2SingleSelectField{id name options{id name}}}} views(first:30){nodes{id name}} items(first:100){nodes{id content{... on DraftIssue{title} ... on Issue{number title}}}}}}}`,{id:p.id});
              let d=(await G()).node,F=Object.fromEntries(d.fields.nodes.filter(Boolean).map(x=>[x.name,x]));
              const C=async(name,type,opts)=>{if(F[name])return;await github.graphql(`mutation($p:ID!,$n:String!${opts?', $o:[ProjectV2SingleSelectFieldOptionInput!]!':''}){createProjectV2Field(input:{projectId:$p,name:$n,dataType:${type}${opts?',singleSelectOptions:$o':''}}){projectV2Field{... on ProjectV2Field{id}}}}`,{p:p.id,n:name,...(opts?{o:opts}:{})})};
              const op=(xs,c='GRAY')=>xs.map(name=>({name,color:c,description:name}));
              await C('Phase','SINGLE_SELECT',op(Array.from({length:17},(_,i)=>`P${i}`)));await C('Priority','SINGLE_SELECT',[...op(['P0 Critical'],'RED'),...op(['P1 High'],'ORANGE'),...op(['P2 Normal'],'YELLOW'),...op(['P3 Low'])]);await C('Subsystem','SINGLE_SELECT',op(['Build / CI','Core','Platform','Input','Math','Rendering','Assets','World','Physics','Gameplay','Networking','Steam','Audio','Animation','AI / Navigation','Editor / Tools','Release','Documentation']));await C('Effort','SINGLE_SELECT',op(['XS','S','M','L']));await C('Roadmap Level','SINGLE_SELECT',[...op(['Phase'],'PURPLE'),...op(['Task'],'BLUE')]);await C('Task ID','TEXT');await C('Start Date','DATE');await C('Target Date','DATE');
              d=(await G()).node;F=Object.fromEntries(d.fields.nodes.filter(Boolean).map(x=>[x.name,x]));if(F.Status)await github.graphql(`mutation($f:ID!,$o:[ProjectV2SingleSelectFieldOptionInput!]!){updateProjectV2Field(input:{fieldId:$f,singleSelectOptions:$o}){projectV2Field{id}}}`,{f:F.Status.id,o:[...op(['Backlog']),...op(['Ready'],'BLUE'),...op(['In Progress'],'YELLOW'),...op(['In Review'],'PURPLE'),...op(['Blocked'],'RED'),...op(['Done'],'GREEN')]});
              d=(await G()).node;F=Object.fromEntries(d.fields.nodes.filter(Boolean).map(x=>[x.name,x]));const S=async(i,f,v)=>{const x=F[f];if(!x)return;const val=f==='Task ID'?{text:v}:{singleSelectOptionId:x.options?.find(o=>o.name===v)?.id};if(Object.values(val).some(z=>!z))return;await github.graphql(`mutation($p:ID!,$i:ID!,$f:ID!,$v:ProjectV2FieldValue!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:$v}){projectV2Item{id}}}`,{p:p.id,i,f:x.id,v:val})};
              const ph=['Feasibility gates and irreversible decisions','Build, modules, and quality gates','Core lifecycle, time, configuration, and native ownership','Platform and input','Math and spatial conventions','Rendering foundation','Asset pipeline and resource lifetime','World, entities, components, prefabs, and scenes','Physics and local interaction','Local first-person vertical slice','Network transport and protocol','Replication and join-in-progress','Prediction, reconciliation, interpolation, and physics correction','Steam session and production transport','Audio, animation, and AI required by the genre','Editor and debugging tools','Production hardening and release gate'];
              d=(await G()).node;for(let i=0;i<17;i++){const title=`P${i} — ${ph[i]}`;let x=d.items.nodes.find(y=>y.content?.title===title);if(!x)x={id:(await github.graphql(`mutation($p:ID!,$t:String!){addProjectV2DraftIssue(input:{projectId:$p,title:$t}){projectItem{id}}}`,{p:p.id,t:title})).addProjectV2DraftIssue.projectItem.id};await S(x.id,'Phase',`P${i}`);await S(x.id,'Roadmap Level','Phase')}
              d=(await G()).node;for(const [n,a] of Object.entries(im)){let x=d.items.nodes.find(y=>y.content?.number===+n);if(!x){const q=await github.graphql(`query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){id}}}`,{o:O,r:R,n:+n});x={id:(await github.graphql(`mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}`,{p:p.id,c:q.repository.issue.id})).addProjectV2ItemById.item.id}}await S(x.id,'Phase','P0');await S(x.id,'Subsystem',a[1]);await S(x.id,'Priority',a[2]);await S(x.id,'Effort',a[3]);await S(x.id,'Task ID',a[4]);await S(x.id,'Status',a[5]);await S(x.id,'Roadmap Level','Task')}
              d=(await G()).node;for(const [name,layout,filter] of [['Roadmap','ROADMAP_LAYOUT','Roadmap Level:Phase'],['Board','BOARD_LAYOUT','Roadmap Level:Task is:open'],['Backlog','TABLE_LAYOUT','Roadmap Level:Task is:open'],['Current Phase','TABLE_LAYOUT','Roadmap Level:Task Phase:P0']]){let v=d.views.nodes.find(x=>x.name===name);if(!v)v={id:(await github.graphql(`mutation($p:ID!,$n:String!,$l:ProjectV2ViewLayout!){createProjectV2View(input:{projectId:$p,name:$n,layout:$l}){projectV2View{id}}}`,{p:p.id,n:name,l:layout})).createProjectV2View.projectV2View.id};await github.graphql(`mutation($i:ID!,$f:String!){updateProjectV2View(input:{viewId:$i,filter:$f}){projectV2View{id}}}`,{i:v.id,f:filter})}
              console.log(`PROJECT_URL=https://github.com/users/${O}/projects/${p.number}`);
            }catch(e){core.warning(`Project setup unavailable to GITHUB_TOKEN: ${e.message}`)}
