name: Java 25 Toolchain Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  verify-java-25:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Report Java toolchains
        run: .\gradlew.bat javaToolchains

      - name: Run tests
        run: .\gradlew.bat test
