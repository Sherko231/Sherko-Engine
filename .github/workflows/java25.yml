      - name: Verify P5-T03 OpenGL resource ownership
        env:
          SHERKO_P5_T03_NATIVE: "true"
        run: .\gradlew.bat :engine-render-opengl:test --tests "com.samo.engine.render.opengl.internal.OpenGlResourceNativeTest" --rerun-tasks

      - name: Upload P5-T03 OpenGL resource evidence
