name: Java 25 CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# P1-T08 keeps each required verification concern visible as its own CI job.
jobs:
  build:
    name: Build and quality gates
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Report Java toolchains
        run: .\gradlew.bat javaToolchains

      - name: List declared projects
        run: .\gradlew.bat projects

      - name: Build all modules
        run: .\gradlew.bat buildAllModules

  unit-tests:
    name: Unit tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run root and subproject tests
        run: .\gradlew.bat test

  architecture-tests:
    name: Architecture tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enforce module API/package boundaries
        run: .\gradlew.bat :test --tests "com.samo.architecture.ModulePackageBoundaryTest" --rerun-tasks

  coverage:
    name: JaCoCo coverage reports
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and verify JaCoCo reports
        run: .\gradlew.bat verifyJacocoReports

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '*/build/reports/jacoco/test/**'
          if-no-files-found: error

  windows-native-smoke:
    name: Windows native smoke
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run integrated GLFW/OpenGL/Jolt/OpenAL/UDP smoke
        run: .\gradlew.bat runIntegratedNativeSmoke

      - name: Upload native smoke JFR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-t12-native-smoke-jfr
          path: build/spikes/native-evidence/p0-t12-smoke.jfr
          if-no-files-found: warn
