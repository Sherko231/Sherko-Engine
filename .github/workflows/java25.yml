name: Java 25 Toolchain Check

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '**/*.md'
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# P1-T08A keeps the expensive five-job matrix on final PR candidates (or explicit
# manual dispatch) and uses one lightweight exact-merge verifier on ordinary
# pushes to master. Finish code/docs/self-review before opening a non-draft PR.
# All CI jobs use GitHub-hosted Windows. The native acceptance job provisions a
# pinned Mesa software OpenGL stack inside the ephemeral runner because the stock
# windows-latest image does not expose the required WGL OpenGL context by itself.
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Build and quality gates
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Report Java toolchains
        run: .\gradlew.bat javaToolchains

      - name: List declared projects
        run: .\gradlew.bat projects

      - name: Resolve committed dependency locks
        shell: powershell
        run: |
          & .\gradlew.bat resolveAndLockAllDependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- ':(glob)**/*.lockfile' '*.lockfile'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate committed Phase 5 GLSL
        run: .\gradlew.bat :engine-render-opengl:validateGlsl --rerun-tasks

      - name: Build all modules
        run: .\gradlew.bat buildAllModules

      - name: Run client foundation entry point
        run: .\gradlew.bat :game-client:runClient

      - name: Run headless server foundation entry point
        run: .\gradlew.bat :game-server:runServer

      - name: Verify headless server runtime boundary
        run: .\gradlew.bat :game-server:verifyHeadlessServerRuntime

      - name: Verify client/server version reporting
        shell: powershell
        run: |
          $clientLines = & .\gradlew.bat -q :game-client:runClient --args="--version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $serverLines = & .\gradlew.bat -q :game-server:runServer --args="--version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          function Convert-VersionReport([string[]] $lines) {
            $report = @{}
            foreach ($line in $lines) {
              if ($line -match '^([^=]+)=(.*)$') {
                $report[$matches[1]] = $matches[2]
              }
            }
            return $report
          }

          $client = Convert-VersionReport $clientLines
          $server = Convert-VersionReport $serverLines
          $required = @('executable', 'engineCommit', 'protocolVersion', 'assetVersion', 'javaVersion', 'nativeLibraries')
          foreach ($key in $required) {
            if (-not $client.ContainsKey($key) -or [string]::IsNullOrWhiteSpace($client[$key])) {
              throw "Client version report missing required key: $key"
            }
            if (-not $server.ContainsKey($key) -or [string]::IsNullOrWhiteSpace($server[$key])) {
              throw "Server version report missing required key: $key"
            }
          }

          foreach ($key in @('engineCommit', 'protocolVersion', 'assetVersion', 'javaVersion')) {
            if ($client[$key] -ne $server[$key]) {
              throw "Client/server version mismatch for $key`: client=$($client[$key]) server=$($server[$key])"
            }
          }

          if ($client['engineCommit'] -ne '${{ github.sha }}') {
            throw "Version report commit does not match checked-out PR/push SHA: report=$($client['engineCommit']) github=${{ github.sha }}"
          }

          Write-Output "Client version report:"
          $clientLines
          Write-Output "Server version report:"
          $serverLines

  unit-tests:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Unit tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run root and subproject tests
        run: .\gradlew.bat test

      - name: Verify core lifecycle, timing, config, native ownership, allocation, logging, fatal shutdown, and Phase 2 exit evidence
        env:
          SHERKO_P2_EXIT_GATE: "true"
        run: .\gradlew.bat :engine-core:test --tests "com.samo.engine.core.api.EngineSubsystemTest" --tests "com.samo.engine.core.api.SubsystemGraphTest" --tests "com.samo.engine.core.api.SubsystemStartupTest" --tests "com.samo.engine.core.api.EngineClockTest" --tests "com.samo.engine.core.api.FixedStepAccumulatorTest" --tests "com.samo.engine.core.api.FixedStepCatchUpPolicyTest" --tests "com.samo.engine.core.api.FixedStepInterpolationTest" --tests "com.samo.engine.core.api.EngineConfigSchemaTest" --tests "com.samo.engine.core.api.EngineConfigLoaderTest" --tests "com.samo.engine.core.api.NativeResourceRegistryTest" --tests "com.samo.engine.core.api.AllocationMetricBenchmarkTest" --tests "com.samo.engine.core.api.EngineLoggerTest" --tests "com.samo.engine.core.api.FatalTerminationTest" --tests "com.samo.engine.core.api.Phase2IntegratedGateTest" --rerun-tasks

      - name: Upload engine-core acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-subsystem-tests
          path: |
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.EngineSubsystemTest.xml
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.SubsystemGraphTest.xml
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.SubsystemStartupTest.xml
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.EngineClockTest.xml
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.FixedStepAccumulatorTest.xml
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.FixedStepCatchUpPolicyTest.xml
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.FixedStepInterpolationTest.xml
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.EngineConfigSchemaTest.xml
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.EngineConfigLoaderTest.xml
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.NativeResourceRegistryTest.xml
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.AllocationMetricBenchmarkTest.xml
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.EngineLoggerTest.xml
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.FatalTerminationTest.xml
            engine-core/build/test-results/test/TEST-com.samo.engine.core.api.Phase2IntegratedGateTest.xml
            engine-core/build/reports/allocation/p2-t11-allocation-metric.txt
            engine-core/build/reports/phase2/p2-exit-60-second-gate.txt
            engine-core/build/reports/tests/test/**
          if-no-files-found: error

  architecture-tests:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Architecture tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enforce module API/package boundaries
        run: .\gradlew.bat :test-support:test --tests "com.samo.architecture.ModulePackageBoundaryTest" --rerun-tasks

  coverage:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: JaCoCo coverage reports
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and verify JaCoCo reports
        run: .\gradlew.bat verifyJacocoReports

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '*/build/reports/jacoco/test/**'
          if-no-files-found: error

  windows-native-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    name: Windows native smoke
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ALSOFT_DRIVERS: "null"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Mesa is CI-only correctness infrastructure; it does not change the engine's
      # Windows/OpenGL 4.6 production target or qualify physical GPU performance.
      - name: Provision Mesa software OpenGL for hosted Windows
        shell: powershell
        run: |
          $version = "26.1.8"
          $expectedSha256 = "4c6d32e653e0ff9ad07796e40c0bcfabf2764d849e3ce4f3b1590112c87e42f9"
          $archive = Join-Path $env:RUNNER_TEMP "mesa3d-$version-release-msvc.7z"
          $extractDir = Join-Path $env:RUNNER_TEMP "mesa3d-$version"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"

          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Mesa archive SHA-256 mismatch: expected=$expectedSha256 actual=$actualSha256"
          }

          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x $archive "-o$extractDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $x64 = Join-Path $extractDir "x64"
          $mesaOpenGl = Join-Path $x64 "opengl32.dll"
          if (-not (Test-Path $mesaOpenGl)) {
            throw "Mesa x64 opengl32.dll was not found after extraction"
          }

          # windows-latest has no usable OpenGL ICD for the required context.
          # The runner VM is ephemeral, so replace its process-global WGL loader
          # only for this job and install Mesa-only companion DLLs beside it.
          $system32 = Join-Path $env:WINDIR "System32"
          $systemOpenGl = Join-Path $system32 "opengl32.dll"
          & takeown.exe /F $systemOpenGl | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & icacls.exe $systemOpenGl /grant "Administrators:(F)" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Path $mesaOpenGl -Destination $systemOpenGl -Force

          Get-ChildItem -Path $x64 -Filter "*.dll" | Where-Object {
            $_.Name -ine "opengl32.dll"
          } | ForEach-Object {
            $destination = Join-Path $system32 $_.Name
            if (-not (Test-Path $destination)) {
              Copy-Item -Path $_.FullName -Destination $destination -Force
            }
          }

          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MESA_LOADER_DRIVER_OVERRIDE=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBGL_ALWAYS_SOFTWARE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Output "Mesa $version provisioned for hosted Windows native verification."
          Write-Output "Renderer mode: llvmpipe software OpenGL; no physical GPU performance claim is made."

      - name: Run GLFW and OpenAL native lifecycle smoke
        run: .\gradlew.bat runWindowsNativeCiSmoke

      - name: Verify P3-T01 production GLFW/OpenGL window
        env:
          SHERKO_P3_T01_NATIVE: "true"
        run: .\gradlew.bat :engine-platform-lwjgl:test --tests "com.samo.engine.platform.api.GlfwWindowNativeTest" --rerun-tasks

      - name: Upload P3-T01 GLFW window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-t01-glfw-window
          path: |
            engine-platform-lwjgl/build/test-results/test/TEST-com.samo.engine.platform.api.GlfwWindowNativeTest.xml
            engine-platform-lwjgl/build/reports/p3/p3-t01-glfw-window.txt
          if-no-files-found: error

      - name: Verify P3-T02 logical and framebuffer sizing
        env:
          SHERKO_P3_T02_NATIVE: "true"
        run: .\gradlew.bat :engine-platform-lwjgl:test --tests "com.samo.engine.platform.api.GlfwWindowSizeNativeTest" --rerun-tasks

      - name: Upload P3-T02 window size evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-t02-window-size
          path: |
            engine-platform-lwjgl/build/test-results/test/TEST-com.samo.engine.platform.api.GlfwWindowSizeNativeTest.xml
            engine-platform-lwjgl/build/reports/p3/p3-t02-window-size.txt
          if-no-files-found: error

      - name: Verify P3-T03 window mode transitions
        env:
          SHERKO_P3_T03_NATIVE: "true"
        run: .\gradlew.bat :engine-platform-lwjgl:test --tests "com.samo.engine.platform.api.GlfwWindowModeNativeTest" --rerun-tasks

      - name: Upload P3-T03 window mode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-t03-window-modes
          path: |
            engine-platform-lwjgl/build/test-results/test/TEST-com.samo.engine.platform.api.GlfwWindowModeNativeTest.xml
            engine-platform-lwjgl/build/reports/p3/p3-t03-window-modes.txt
          if-no-files-found: error

      - name: Verify P3-T04 focus-loss input safety
        env:
          SHERKO_P3_T04_NATIVE: "true"
        run: .\gradlew.bat :engine-platform-lwjgl:test --tests "com.samo.engine.platform.api.GlfwWindowFocusNativeTest" --rerun-tasks

      - name: Upload P3-T04 focus-loss evidence
