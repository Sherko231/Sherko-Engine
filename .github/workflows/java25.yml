            engine-render-opengl/build/test-results/test/TEST-com.samo.engine.render.opengl.internal.DirectionalLightNativeTest.xml
            engine-render-opengl/build/reports/p5/p5-t13-directional-light.txt
            engine-render-opengl/build/reports/p5/p5-t13-directional-light.png
          if-no-files-found: error

      - name: Verify P5-T14 bounded local lights
        env:
          SHERKO_P5_T14_NATIVE: "true"
        run: .\gradlew.bat :engine-render-opengl:test --tests "com.samo.engine.render.opengl.internal.LocalLightsNativeTest" --rerun-tasks

      - name: Upload P5-T14 local light evidence
        if: always()
