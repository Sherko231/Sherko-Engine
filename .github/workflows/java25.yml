name: Java 25 Toolchain Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# P1-T08 keeps each required verification concern visible as its own CI job.
jobs:
  build:
    name: Build and quality gates
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Report Java toolchains
        run: .\gradlew.bat javaToolchains

      - name: List declared projects
        run: .\gradlew.bat projects

      - name: Verify dependency locks reproduce
        shell: pwsh
        run: |
          .\gradlew.bat resolveAndLockAllDependencies --write-locks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- ':(glob)**/gradle.lockfile'

      - name: Build all modules
        run: .\gradlew.bat buildAllModules

      - name: Run client foundation entry point
        run: .\gradlew.bat :game-client:runClient

      - name: Run headless server foundation entry point
        run: .\gradlew.bat :game-server:runServer

      - name: Verify headless server runtime boundary
        run: .\gradlew.bat :game-server:verifyHeadlessServerRuntime

      - name: Verify client/server version reporting
        shell: pwsh
        run: |
          $clientLines = & .\gradlew.bat -q :game-client:runClient --args="--version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $serverLines = & .\gradlew.bat -q :game-server:runServer --args="--version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          function Convert-VersionReport([string[]] $lines) {
            $report = @{}
            foreach ($line in $lines) {
              if ($line -match '^([^=]+)=(.*)$') {
                $report[$matches[1]] = $matches[2]
              }
            }
            return $report
          }

          $client = Convert-VersionReport $clientLines
          $server = Convert-VersionReport $serverLines
          $required = @('executable', 'engineCommit', 'protocolVersion', 'assetVersion', 'javaVersion', 'nativeLibraries')
          foreach ($key in $required) {
            if (-not $client.ContainsKey($key) -or [string]::IsNullOrWhiteSpace($client[$key])) {
              throw "Client version report missing required key: $key"
            }
            if (-not $server.ContainsKey($key) -or [string]::IsNullOrWhiteSpace($server[$key])) {
              throw "Server version report missing required key: $key"
            }
          }

          foreach ($key in @('engineCommit', 'protocolVersion', 'assetVersion', 'javaVersion')) {
            if ($client[$key] -ne $server[$key]) {
              throw "Client/server version mismatch for $key`: client=$($client[$key]) server=$($server[$key])"
            }
          }

          if ($client['engineCommit'] -ne '${{ github.sha }}') {
            throw "Version report commit does not match checked-out PR/push SHA: report=$($client['engineCommit']) github=${{ github.sha }}"
          }

          Write-Output "Client version report:"
          $clientLines
          Write-Output "Server version report:"
          $serverLines

  unit-tests:
    name: Unit tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run root and subproject tests
        run: .\gradlew.bat test

  architecture-tests:
    name: Architecture tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enforce module API/package boundaries
        run: .\gradlew.bat :test-support:test --tests "com.samo.architecture.ModulePackageBoundaryTest" --rerun-tasks

  coverage:
    name: JaCoCo coverage reports
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and verify JaCoCo reports
        run: .\gradlew.bat verifyJacocoReports

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '*/build/reports/jacoco/test/**'
          if-no-files-found: error

  windows-native-smoke:
    name: Windows native smoke
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      ALSOFT_DRIVERS: "null"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run GLFW and OpenAL native lifecycle smoke
        run: .\gradlew.bat runWindowsNativeCiSmoke

      - name: Run Jolt JNI lifecycle smoke
        run: .\gradlew.bat runJoltLifecycleSpike -PjoltSpikeCycles=1
