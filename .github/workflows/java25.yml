          path: |
            engine-platform-lwjgl/build/test-results/test/TEST-com.samo.engine.platform.api.GlfwWindowFocusNativeTest.xml
            engine-platform-lwjgl/build/reports/p3/p3-t04-focus-loss.txt
          if-no-files-found: error

      - name: Verify P3-T05 raw mouse motion and fallback
        env:
          SHERKO_P3_T05_NATIVE: "true"
        run: .\gradlew.bat :engine-platform-lwjgl:test --tests "com.samo.engine.platform.api.GlfwWindowMouseMotionNativeTest" --rerun-tasks

