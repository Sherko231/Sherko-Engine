            engine-render-opengl/build/reports/p5/p5-t05-glsl-runtime.txt
          if-no-files-found: error

      - name: Verify P5-T06 uniform block ABI and reflection
        env:
          SHERKO_P5_T06_NATIVE: "true"
        run: .\gradlew.bat :engine-render-opengl:test --tests "com.samo.engine.render.opengl.internal.UniformBlockNativeTest" --rerun-tasks

