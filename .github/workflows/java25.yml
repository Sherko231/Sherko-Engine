name: Java 25 Toolchain Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  verify-java:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve and write dependency locks for P1-T06 verification
        run: .\gradlew.bat resolveAndLockAllDependencies --write-locks

      - name: Upload generated dependency locks
        uses: actions/upload-artifact@v4
        with:
          name: p1-t06-generated-locks
          path: |
            gradle.lockfile
            */gradle.lockfile
          if-no-files-found: error

      - name: Report Java toolchains
        run: .\gradlew.bat javaToolchains

      - name: List declared projects
        run: .\gradlew.bat projects

      - name: Build all modules
        run: .\gradlew.bat buildAllModules

      - name: Run tests and verify JaCoCo reports
        run: .\gradlew.bat verifyJacocoReports

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '*/build/reports/jacoco/test/**'
          if-no-files-found: error
