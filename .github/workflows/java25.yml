            engine-render-opengl/build/reports/p5/p5-t15-srgb-presentation.txt
            engine-render-opengl/build/reports/p5/p5-t15-srgb-presentation.png
          if-no-files-found: error

      - name: Verify P5-T16 debug geometry
        env:
          SHERKO_P5_T16_NATIVE: "true"
        run: .\gradlew.bat :engine-render-opengl:test --tests "com.samo.engine.render.opengl.internal.DebugGeometryNativeTest" --rerun-tasks

      - name: Upload P5-T16 debug geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-t16-debug-geometry
          path: |
            engine-render-opengl/build/test-results/test/TEST-com.samo.engine.render.opengl.internal.DebugGeometryNativeTest.xml
            engine-render-opengl/build/reports/p5/p5-t16-debug-geometry.txt
            engine-render-opengl/build/reports/p5/p5-t16-debug-geometry.png
          if-no-files-found: error

      - name: Verify P5-T17 view-model layer
        env:
          SHERKO_P5_T17_NATIVE: "true"
        run: .\gradlew.bat :engine-render-opengl:test --tests "com.samo.engine.render.opengl.internal.ViewModelNativeTest" --rerun-tasks

      - name: Upload P5-T17 view-model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-t17-view-model
          path: |
            engine-render-opengl/build/test-results/test/TEST-com.samo.engine.render.opengl.internal.ViewModelNativeTest.xml
            engine-render-opengl/build/reports/p5/p5-t17-view-model.txt
            engine-render-opengl/build/reports/p5/p5-t17-view-model.png
          if-no-files-found: error

      - name: Run Jolt JNI lifecycle smoke
        run: .\gradlew.bat runJoltLifecycleSpike -PjoltSpikeCycles=1

  master-verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: Lightweight master verification
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify committed dependency locks
        shell: powershell
        run: |
          & .\gradlew.bat resolveAndLockAllDependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- ':(glob)**/*.lockfile' '*.lockfile'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify headless server runtime boundary
        run: .\gradlew.bat :game-server:verifyHeadlessServerRuntime

      - name: Verify exact-merge client/server version reporting
        shell: powershell
        run: |
          $clientLines = & .\gradlew.bat -q :game-client:runClient --args="--version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $serverLines = & .\gradlew.bat -q :game-server:runServer --args="--version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          function Convert-VersionReport([string[]] $lines) {
            $report = @{}
            foreach ($line in $lines) {
              if ($line -match '^([^=]+)=(.*)$') {
                $report[$matches[1]] = $matches[2]
              }
            }
            return $report
          }

          $client = Convert-VersionReport $clientLines
          $server = Convert-VersionReport $serverLines
          $required = @('executable', 'engineCommit', 'protocolVersion', 'assetVersion', 'javaVersion', 'nativeLibraries')
          foreach ($key in $required) {
            if (-not $client.ContainsKey($key) -or [string]::IsNullOrWhiteSpace($client[$key])) {
              throw "Client version report missing required key: $key"
            }
            if (-not $server.ContainsKey($key) -or [string]::IsNullOrWhiteSpace($server[$key])) {
              throw "Server version report missing required key: $key"
            }
          }

          foreach ($key in @('engineCommit', 'protocolVersion', 'assetVersion', 'javaVersion')) {
            if ($client[$key] -ne $server[$key]) {
              throw "Client/server version mismatch for $key`: client=$($client[$key]) server=$($server[$key])"
            }
          }

          if ($client['engineCommit'] -ne '${{ github.sha }}') {
            throw "Version report commit does not match exact merged master SHA: report=$($client['engineCommit']) github=${{ github.sha }}"
          }

          Write-Output "Verified exact master commit: ${{ github.sha }}"
          Write-Output "Client version report:"
          $clientLines
          Write-Output "Server version report:"
          $serverLines
