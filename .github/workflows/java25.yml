name: Java 25 Toolchain Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  verify-java:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Report Java toolchains
        run: .\gradlew.bat javaToolchains

      - name: List declared projects
        run: .\gradlew.bat projects

      - name: Build all modules
        run: .\gradlew.bat buildAllModules

      - name: Run tests
        run: .\gradlew.bat test
