            engine-render-opengl/build/reports/p5/p5-t04-bounded-upload.txt
          if-no-files-found: error

      - name: Verify P5-T05 committed GLSL runtime compile/link
        env:
          SHERKO_P5_T05_NATIVE: "true"
        run: .\gradlew.bat :engine-render-opengl:test --tests "com.samo.engine.render.opengl.internal.GlslRuntimeValidationNativeTest" --rerun-tasks

      - name: Upload P5-T05 GLSL runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
