name: P7 T02 Documentation Sync

"on":
  push:
    branches:
      - p7-t02-packed-component-store

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p7-t02-packed-component-store

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Synchronize Phase 7 documentation
        run: python tools/p7_t02_doc_sync.py

      - name: Check documentation diff
        run: |
          git diff --check
          git diff -- docs/ARCHITECTURE.md docs/DEVELOPMENT_STATUS.md ROADMAP.md

      - name: Commit synchronized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md docs/DEVELOPMENT_STATUS.md ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "[P7-T02] Synchronize Phase 7 documentation"
          git push origin HEAD:p7-t02-packed-component-store
