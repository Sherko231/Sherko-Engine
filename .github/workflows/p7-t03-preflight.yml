name: P7-T03 Preflight

on:
  push:
    branches:
      - p7-t03-deferred-structural-commands

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p7-t03-deferred-structural-commands
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify formatting
        run: .\gradlew.bat spotlessCheck
      - name: Run engine-world tests
        run: .\gradlew.bat :engine-world:test --rerun-tasks
      - name: Run architecture boundary test
        run: .\gradlew.bat :test-support:test --tests "com.samo.architecture.ModulePackageBoundaryTest" --rerun-tasks
      - name: Apply bounded documentation candidate
        shell: bash
        run: |
          python .github/scripts/p7_t03_doc_sync.py > /dev/null
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/ARCHITECTURE.md")
          path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
          git diff --check
          changed="$(git diff --name-only -- docs/DEVELOPMENT_STATUS.md docs/ARCHITECTURE.md)"
          printf '%s\n' "$changed"
          test "$changed" = $'docs/ARCHITECTURE.md\ndocs/DEVELOPMENT_STATUS.md'
      - name: Commit generated documentation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE.md docs/DEVELOPMENT_STATUS.md
          git commit -m "Reconcile P7-T03 architecture and status"
          git push origin HEAD:p7-t03-deferred-structural-commands
