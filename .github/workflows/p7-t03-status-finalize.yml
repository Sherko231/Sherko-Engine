name: P7-T03 Status Finalize

on:
  push:
    branches:
      - p7-t03-deferred-structural-commands

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p7-t03-deferred-structural-commands
          fetch-depth: 0
      - name: Reconcile final candidate wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/DEVELOPMENT_STATUS.md")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "This temporary branch-only preflight is authoring evidence only and will be removed before the final candidate; final acceptance still requires the exact-head five-job PR matrix and exact-merge Lightweight verification.",
                  "The temporary branch-only preflight tooling was removed before this final candidate; this authoring evidence is not acceptance evidence, and final acceptance still requires the exact-head five-job PR matrix and exact-merge Lightweight verification.",
              ),
              (
                  "Exact next action: finish P7-T03 / Issue #418 only, remove temporary preflight tooling, complete the final diff/self-review/consistency audit, open one final non-draft PR, require the five-job exact-head matrix, merge only while tested head/base remain current, then require exact-merge Lightweight verification before closing #418.",
                  "Exact next action: finish P7-T03 / Issue #418 only, complete the final diff/self-review/consistency audit, open one final non-draft PR, require the five-job exact-head matrix, merge only while tested head/base remain current, then require exact-merge Lightweight verification before closing #418.",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one status match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
      - name: Commit status and remove helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/DEVELOPMENT_STATUS.md
          git rm .github/workflows/p7-t03-status-finalize.yml
          git commit -m "Finalize P7-T03 candidate status"
          git push origin HEAD:p7-t03-deferred-structural-commands
