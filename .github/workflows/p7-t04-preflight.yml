name: P7-T04 Preflight

on:
  push:
    branches: [ p7-t04-fixed-world-update-phases ]

jobs:
  preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless check
        run: .\gradlew.bat spotlessCheck
      - name: Engine world tests
        run: .\gradlew.bat :engine-world:test --rerun-tasks
      - name: Architecture boundary test
        run: .\gradlew.bat :test-support:test --tests "com.samo.architecture.ModulePackageBoundaryTest" --rerun-tasks
