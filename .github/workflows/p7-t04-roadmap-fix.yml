name: P7-T04 Roadmap Reconcile

on:
  push:
    branches: [ p7-t04-fixed-world-update-phases ]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p7-t04-fixed-world-update-phases
      - name: Reconcile remaining Phase 7 roadmap sentence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          old = 'Phase 7 is active: P7-T01 / Issue #414 and P7-T02 / Issue #416 are accepted, and P7-T03 / Issue #418 is the current bounded task. Exact task definitions and acceptance criteria remain in the [technical backlog](docs/roadmap/TECHNICAL_BACKLOG.md).'
          new = 'Phase 7 is active: P7-T01 / Issue #414, P7-T02 / Issue #416, and P7-T03 / Issue #418 are accepted, and P7-T04 / Issue #420 is the current bounded task. Exact task definitions and acceptance criteria remain in the [technical backlog](docs/roadmap/TECHNICAL_BACKLOG.md).'
          if new not in text:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one stale roadmap sentence, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check
      - name: Commit roadmap reconciliation
        run: |
          if git diff --quiet -- ROADMAP.md; then exit 0; fi
          git config user.name "Sherko"
          git config user.email "120306123+Sherko231@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "chore: finish P7-T04 roadmap reconciliation"
          git push origin HEAD:p7-t04-fixed-world-update-phases
