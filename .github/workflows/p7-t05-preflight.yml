name: P7-T05 Branch Preflight

on:
  push:
    branches: [ p7-t05-core-world-components ]

jobs:
  preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify committed documentation text integrity
        shell: powershell
        run: |
          python -c "from pathlib import Path; files=['README.md','ROADMAP.md','docs/ARCHITECTURE.md','docs/DECISIONS.md','docs/DEVELOPMENT_STATUS.md','wiki/API_INDEX.md','wiki/LIMITATIONS.md','wiki/README.md','wiki/WORLD/COMPONENTS.md']; bad=[]; [bad.append(p) for p in files if 'â€' in Path(p).read_text(encoding='utf-8')]; assert not bad, f'mojibake detected: {bad}'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check HEAD^ HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify formatting
        run: .\gradlew.bat spotlessCheck
      - name: Run engine-world tests
        run: .\gradlew.bat :engine-world:test --rerun-tasks
      - name: Run architecture boundary test
        run: .\gradlew.bat :test-support:test --tests "com.samo.architecture.ModulePackageBoundaryTest" --rerun-tasks
      - name: Run repository check
        run: .\gradlew.bat check
      - name: Resolve and verify dependency locks
        shell: powershell
        run: |
          & .\gradlew.bat resolveAndLockAllDependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- '*.lockfile'
          if ($LASTEXITCODE -ne 0) { Write-Error 'P7-T05 unexpectedly changed dependency lockfiles'; exit $LASTEXITCODE }
