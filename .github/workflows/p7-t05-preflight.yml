name: P7-T05 Branch Preflight

on:
  push:
    branches: [ p7-t05-core-world-components ]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply guarded documentation and wiki sync
        shell: powershell
        run: |
          python tools/p7_t05_sync.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $architecture = Get-Content docs/ARCHITECTURE.md -Raw
          $architecture = $architecture.TrimEnd("`r", "`n") + "`n"
          [System.IO.File]::WriteAllText((Resolve-Path docs/ARCHITECTURE.md), $architecture, [System.Text.UTF8Encoding]::new($false))
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- README.md ROADMAP.md docs/ARCHITECTURE.md docs/DECISIONS.md docs/DEVELOPMENT_STATUS.md wiki/API_INDEX.md wiki/LIMITATIONS.md wiki/README.md wiki/WORLD/COMPONENTS.md
            git commit -m "docs: reconcile P7-T05 public component contract"
            git push origin HEAD:$env:GITHUB_REF_NAME
          }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Apply authoritative formatting
        shell: powershell
        run: |
          & .\gradlew.bat spotlessApply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- engine-world/src/main/java engine-world/src/test/java
            git commit -m "style: apply Spotless to P7-T05"
            git push origin HEAD:$env:GITHUB_REF_NAME
          }
      - name: Verify formatting
        run: .\gradlew.bat spotlessCheck
      - name: Run engine-world tests
        run: .\gradlew.bat :engine-world:test --rerun-tasks
      - name: Run architecture boundary test
        run: .\gradlew.bat :test-support:test --tests "com.samo.architecture.ModulePackageBoundaryTest" --rerun-tasks
