name: P7-T06 Branch Preflight

on:
  push:
    branches: [ p7-t06-authoring-entity-guids ]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply authoritative formatting
        shell: powershell
        run: |
          & .\gradlew.bat spotlessApply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git status --porcelain -- '*.java') {
            git config user.name "Sherko"
            git config user.email "120306123+Sherko231@users.noreply.github.com"
            git add -- '*.java'
            git commit -m "style: apply P7-T06 Spotless formatting"
            git push
          }
      - name: Verify formatting
        run: .\gradlew.bat spotlessCheck
      - name: Run engine-world tests
        run: .\gradlew.bat :engine-world:test --rerun-tasks
      - name: Run architecture boundary test
        run: .\gradlew.bat :test-support:test --tests "com.samo.architecture.ModulePackageBoundaryTest" --rerun-tasks
