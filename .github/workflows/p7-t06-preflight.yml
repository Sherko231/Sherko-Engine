name: P7-T06 Branch Preflight

on:
  push:
    branches: [ p7-t06-authoring-entity-guids ]

jobs:
  preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify committed diff hygiene
        shell: powershell
        run: |
          git diff --check master...HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify formatting
        run: .\gradlew.bat spotlessCheck
      - name: Run engine-world tests
        run: .\gradlew.bat :engine-world:test --rerun-tasks
      - name: Run architecture boundary test
        run: .\gradlew.bat :test-support:test --tests "com.samo.architecture.ModulePackageBoundaryTest" --rerun-tasks
      - name: Run repository check
        run: .\gradlew.bat check
      - name: Resolve and verify dependency locks
        shell: powershell
        run: |
          & .\gradlew.bat resolveAndLockAllDependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- '*.lockfile'
          if ($LASTEXITCODE -ne 0) { Write-Error 'P7-T06 unexpectedly changed dependency lockfiles'; exit $LASTEXITCODE }
