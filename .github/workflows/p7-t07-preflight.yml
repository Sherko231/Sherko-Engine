name: P7-T07 Authoring Preflight

"on":
  push:
    branches:
      - p7-t07-scene-json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p7-t07-scene-json
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reconcile P7-T07 documentation
        shell: pwsh
        run: python tools/p7_t07_doc_sync.py
      - name: Guard documentation diff
        shell: pwsh
        run: |
          $allowed = @(
            'README.md',
            'ROADMAP.md',
            'docs/DEVELOPMENT_STATUS.md',
            'docs/ARCHITECTURE.md',
            'docs/DECISIONS.md',
            'docs/SPATIAL_CONVENTIONS.md',
            'wiki/README.md',
            'wiki/API_INDEX.md',
            'wiki/LIMITATIONS.md',
            'wiki/WORLD/ENTITY_IDS.md',
            'wiki/WORLD/SCENES.md'
          )
          $changed = @(git diff --name-only)
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) {
              throw "Unexpected documentation path: $path"
            }
          }
          git diff --check
      - name: Full branch verification
        shell: pwsh
        run: |
          .\gradlew.bat spotlessCheck
          .\gradlew.bat :engine-world:test --rerun-tasks
          .\gradlew.bat :test-support:test --tests "com.samo.architecture.ModulePackageBoundaryTest" --rerun-tasks
          .\gradlew.bat check
          .\gradlew.bat resolveAndLockAllDependencies
          if (git diff --name-only -- engine-world/gradle.lockfile) { throw 'Committed engine-world lock drift detected' }
      - name: Commit documentation changes
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'No documentation changes to commit.'
            exit 0
          }
          git config user.name 'Sherko'
          git config user.email '120306123+Sherko231@users.noreply.github.com'
          git add -- README.md ROADMAP.md docs/DEVELOPMENT_STATUS.md docs/ARCHITECTURE.md docs/DECISIONS.md docs/SPATIAL_CONVENTIONS.md wiki/README.md wiki/API_INDEX.md wiki/LIMITATIONS.md wiki/WORLD/ENTITY_IDS.md wiki/WORLD/SCENES.md
          git commit -m 'docs: define P7-T07 scene persistence contract'
          git push origin HEAD:p7-t07-scene-json
