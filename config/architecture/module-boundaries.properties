# P1-T07 module/package boundary registry.
# Each declared Gradle subproject owns one package root, exports only its api root to other modules,
# and reserves an internal root that is never a cross-module contract.

engine-core.root=com.samo.engine.core
engine-core.api=com.samo.engine.core.api
engine-core.internal=com.samo.engine.core.internal

